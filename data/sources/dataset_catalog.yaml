# Dataset catalog for the Customer Churn Prediction Platform.
#
# Policy: acquisition code may download a dataset only when
#   approved_for_automatic_download: true
# AND license/provenance are documented in this file.
# Unknown or undocumented sources must fail closed.

catalog_version: 1
updated_on: "2026-09-22"
primary_dataset_id: ibm_telco_customer_churn

selection_rationale: >
  IBM Telco Customer Churn is the primary public dataset because it is a
  well-known fictional telecom sample, has a documented publisher (IBM),
  is downloadable from IBM's own GitHub without a Kaggle API token, uses a
  schema that matches the existing ML contract in this repository, and is
  small enough for local development. It is NOT real customer data. The
  UCI Iranian Churn dataset is the approved alternative when a Creative
  Commons license is preferred.

datasets:
  - id: ibm_telco_customer_churn
    name: IBM Telco Customer Churn
    classification: public_sample
    real_customer_data: false
    suitable_for_project: true
    approved_for_automatic_download: true
    role: primary
    publisher: IBM
    source_type: public_csv
    landing_page: https://community.ibm.com/community/user/blogs/steven-macko/2019/07/11/telco-customer-churn-1113
    download_url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
    repository_url: https://github.com/IBM/telco-customer-churn-on-icp4d
    kaggle_mirror: https://www.kaggle.com/datasets/blastchar/telco-customer-churn
    license: Apache-2.0 (code pattern repository); sample data license not separately published
    license_notes: >
      IBM publishes this as fictional sample data for Cognos Analytics /
      Cloud Pak for Data tutorials. The hosting repository is Apache-2.0.
      IBM has not published a standalone data-only license. This project
      treats the file as an educational sample, attributes IBM, and does
      not redistribute it through Git. Review IBM's terms before any
      commercial redistribution.
    citation: >
      IBM, "Telco customer churn (11.1.3+)" sample, Cognos Analytics base
      samples / IBM Cloud Pak for Data code pattern.
    publication_year: 2019
    approximate_size: ~950 KB
    n_records: 7043
    n_features: 21
    target_column: Churn
    target_values: ["Yes", "No"]
    identifier_column: customerID
    features:
      - customerID
      - gender
      - SeniorCitizen
      - Partner
      - Dependents
      - tenure
      - PhoneService
      - MultipleLines
      - InternetService
      - OnlineSecurity
      - OnlineBackup
      - DeviceProtection
      - TechSupport
      - StreamingTV
      - StreamingMovies
      - Contract
      - PaperlessBilling
      - PaymentMethod
      - MonthlyCharges
      - TotalCharges
      - Churn
    known_limitations:
      - Fictional California telco sample, not production CDR/CRM extracts.
      - Snapshot / cross-sectional; no event-time history for true drift.
      - TotalCharges is stored as string and contains blanks for tenure=0.
      - Class imbalance (~26.5% churn) is realistic but not identical to any live book of business.
      - Extended IBM sample (33 columns) includes Churn Score / CLTV / Churn Reason, which leak the target; this project uses the 21-column version only.
    output_filename: Telco-Customer-Churn.csv
    min_bytes: 500000
    expected_columns: 21
    checksum_sha256: null

  - id: uci_iranian_churn
    name: Iranian Churn Dataset
    classification: public_research
    real_customer_data: true
    suitable_for_project: true
    approved_for_automatic_download: true
    role: approved_alternative
    publisher: UCI Machine Learning Repository
    source_type: public_csv
    landing_page: https://archive.ics.uci.edu/dataset/563/iranian+churn+dataset
    download_url: https://archive.ics.uci.edu/static/public/563/data.csv
    doi: 10.24432/C5JW3Z
    license: CC BY 4.0
    license_notes: >
      UCI documents this dataset under Creative Commons Attribution 4.0.
      Cite the DOI. The data were collected from an Iranian telecom company
      and anonymized; they are still operationally derived, so do not treat
      rows as re-identifiable people and do not commit the file to Git.
    citation: >
      Iranian Churn [Dataset]. (2020). UCI Machine Learning Repository.
      https://doi.org/10.24432/C5JW3Z
    publication_year: 2020
    donated_on: "2020-04-08"
    approximate_size: 128.6 KB
    n_records: 3150
    n_features: 13
    target_column: Churn
    target_values: [0, 1]
    identifier_column: null
    features:
      - Call Failure
      - Complains
      - Subscription Length
      - Charge Amount
      - Seconds of Use
      - Frequency of use
      - Frequency of SMS
      - Distinct Called Numbers
      - Age Group
      - Tariff Plan
      - Status
      - Customer Value
      - Churn
    known_limitations:
      - Features are 9-month aggregates; label is status after 12 months (3-month planning gap).
      - No customer identifier in the public file, which limits joins and uniqueness checks.
      - Feature names and encodings differ from the IBM Telco schema used by this repo's ML contract.
      - Some third-party copies add FN/FP columns that are not part of the UCI 13-feature description.
    output_filename: iranian_churn.csv
    min_bytes: 50000
    expected_columns: 13
    checksum_sha256: null

  - id: orange_telecom_bigml
    name: Orange Telecom Customer Churn (BigML split)
    classification: public_research_mirror
    real_customer_data: false
    suitable_for_project: false
    approved_for_automatic_download: false
    role: documented_candidate
    publisher: Orange / BigML community distribution
    source_type: public_csv
    landing_page: https://www.kaggle.com/datasets/mnassrib/telecom-churn-datasets
    download_url: null
    license: Unclear for programmatic redistribution; some Kaggle mirrors label CC0
    license_notes: >
      Usage-based churn tables (churn-bigml-80/20) are widely mirrored.
      Original Orange/BigML redistribution terms are not consistently
      documented on those mirrors. This project will not auto-download it.
    citation: Community mirrors of Orange Telecom churn activity data (BigML 80/20 split).
    publication_year: null
    approximate_size: ~220 KB training split
    n_records: 3333
    n_features: 20
    target_column: Churn
    target_values: [true, false]
    identifier_column: null
    features:
      - state
      - account length
      - area code
      - international plan
      - voice mail plan
      - number vmail messages
      - total day minutes
      - total day calls
      - total day charge
      - total eve minutes
      - total eve calls
      - total eve charge
      - total night minutes
      - total night calls
      - total night charge
      - total intl minutes
      - total intl calls
      - total intl charge
      - customer service calls
      - Churn
    known_limitations:
      - No stable canonical URL with an unambiguous license.
      - US-centric activity features, not billing/contract features like IBM Telco.
      - 80/20 files are already split; using them as "raw" hides the original population.
    rejection_reason: License and canonical download URL are not clear enough for silent acquisition.

  - id: cell2cell_duke
    name: Cell2Cell / Duke Teradata CRM churn case
    classification: academic_case
    real_customer_data: false
    suitable_for_project: false
    approved_for_automatic_download: false
    role: documented_candidate
    publisher: Teradata Center for CRM, Duke University (Fuqua)
    source_type: academic_case_data
    landing_page: https://www.kaggle.com/datasets/jpacse/telecom-churn-new-cell2cell-dataset
    download_url: null
    license: Not clearly published on community mirrors
    license_notes: >
      The Cell2Cell "Churn Game" case is associated with Duke/Teradata.
      Public copies on Kaggle do not establish a redistribution license
      that this project can rely on. Not approved for automatic download.
    citation: Cell2Cell The Churn Game, Teradata Center for CRM at Duke University.
    publication_year: null
    approximate_size: 15-20 MB
    n_records: 71047
    n_features: 75
    target_column: churn
    target_values: [0, 1]
    identifier_column: customer
    features:
      - revenue
      - mou
      - recchrge
      - overage
      - roaming
      - customer care contacts
      - remaining 50+ billing and usage attributes
    known_limitations:
      - Calibration set was oversampled to ~50% churn; validation reflects ~2% monthly churn.
      - Treating the combined file as a natural population would leak sampling design into metrics.
      - No approved download URL for this repository.
    rejection_reason: No clear license or canonical public download endpoint.
