# Training pipeline. The training CSV is frozen with `dvc add`
# (see data/raw/telco_churn.csv.dvc), not regenerated as a DVC stage.
# Do not add a collect `outs` of the same path — that conflicts with `dvc add`.
stages:
  train:
    cmd: python -m ml.training.train
    deps:
      - data/raw/telco_churn.csv
      - ml/features/engineer.py
      - ml/training/train.py
      - ml/training/evaluate.py
      - configs/config.yaml
    params:
      - model.params
      - model.threshold
    outs:
      - artifacts/models/churn_pipeline.joblib
      - artifacts/models/metadata.json
    metrics:
      - artifacts/metrics/metrics.json:
          cache: false
      - artifacts/metrics/feature_importance.json:
          cache: false
