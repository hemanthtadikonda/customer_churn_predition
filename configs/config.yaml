project:
  name: customer-churn-prediction
  version: 0.1.0
  description: Telco customer churn prediction with XGBoost

data:
  raw_path: data/raw/telco_churn.csv
  processed_dir: data/processed
  n_samples: 5000
  test_size: 0.20
  val_size: 0.10
  random_state: 42

model:
  name: xgboost_churn
  artifact_path: artifacts/models/churn_pipeline.joblib
  metadata_path: artifacts/models/metadata.json
  metrics_path: artifacts/metrics/metrics.json
  importance_path: artifacts/metrics/feature_importance.json
  # Decision threshold used at serving time. Tune for recall vs precision.
  threshold: 0.50
  params:
    n_estimators: 250
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.80
    colsample_bytree: 0.80
    min_child_weight: 3
    gamma: 0.10
    reg_lambda: 1.0
    objective: binary:logistic
    eval_metric: aucpr
    tree_method: hist
    n_jobs: -1
    random_state: 42

mlflow:
  tracking_uri: mlruns
  experiment_name: customer-churn-xgboost

api:
  host: 0.0.0.0
  port: 8000
  title: Customer Churn Prediction API
