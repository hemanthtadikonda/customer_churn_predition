# Copy to aws-credentials-secret.yaml, fill values, apply ONCE on the cluster.
# Do not commit real credentials to git.
#
#   kubectl apply -f mlops/kserve/aws-credentials-secret.yaml
#
# Then deploy with inference-service-s3.yaml or add envFrom to your InferenceService.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-aws-credentials
  namespace: default
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_DEFAULT_REGION: "us-east-1"
