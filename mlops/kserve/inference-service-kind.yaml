# kind + MLflow on the same Linux VM (outside the cluster).
# 1. Start MLflow bound to all interfaces: mlflow server --host 0.0.0.0 --port 5000 ...
# 2. Set MLFLOW_HOST_IP to the IP pods can use to reach the host (NOT 127.0.0.1).
#    Common values on kind/Linux:
#      ip -4 route show default | awk '{print $3}'   # docker bridge gateway → host
#      or the VM private IP (e.g. 172.31.x.x) if MLflow listens on 0.0.0.0
# 3. kind load docker-image customer-churn-kserve:latest
# 4. export MLFLOW_HOST_IP=172.17.0.1   # example only — use your value
# 5. envsubst < mlops/kserve/inference-service-kind.yaml | kubectl apply -f -
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: customer-churn-xgboost
  labels:
    app: customer-churn-prediction
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: customer-churn-kserve:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://${MLFLOW_HOST_IP}:5000"
          - name: MLFLOW_MODEL_URI
            value: "models:/customer-churn-xgboost@Staging"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /v1/models/customer-churn-xgboost/ready
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/models/customer-churn-xgboost/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
