# kind + MLflow on the same Linux VM (outside the cluster).
# 1. Start MLflow on 0.0.0.0:5000 (full command in docs/kserve_serving.md Step 2).
# 2. Set MLFLOW_HOST_IP — IP pods use to reach MLflow (NOT 127.0.0.1). Prefer kind node gateway:
#      docker inspect mlops-control-plane --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}'
#    Often 172.18.0.1 on kind; avoid guessing 172.31.32.1 unless a curl test from a pod succeeds.
# 3. kind load docker-image customer-churn-kserve:latest
# 4. export MLFLOW_HOST_IP=172.17.0.1   # example only — use your value
# 5. If MLflow artifacts are on S3: kubectl apply -f mlops/kserve/aws-credentials-secret.yaml (from .example)
# 6. kubectl apply -f mlops/kserve/inference-service-kind.yaml
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: customer-churn-xgboost
  labels:
    app: customer-churn-prediction
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    # Pod uses the host network so http://127.0.0.1:5000 reaches MLflow on the VM.
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: customer-churn-kserve:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://127.0.0.1:5000"
          - name: MLFLOW_MODEL_URI
            value: "models:/customer-churn-xgboost@Staging"
          # Lab fallback (no S3): comment envFrom below, uncomment this, rebuild image after train.
          # - name: KSERVE_USE_LOCAL_JOBLIB
          #   value: "true"
        # Required when MLflow --default-artifact-root is s3://... (same IAM user as training).
        envFrom:
          - secretRef:
              name: mlflow-aws-credentials
        resources:
          requests:
            cpu: "250m"
            memory: "768Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /v1/models/customer-churn-xgboost/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /v1/models/customer-churn-xgboost/ready
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/models/customer-churn-xgboost/ready
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
